<!--
  Plantilla compartida del footer. Se inyecta con fetch() desde
  "../../Recursos/plantillas.js" en 18 de las 19 páginas del sitio, INCLUIDAS
  las ocho del panel de administración. Cualquier cambio acá se ve en todas.

  DISEÑO: "editorial en columnas", elegido por el usuario entre seis propuestas
  el 2026-08-02. Mantiene la estructura de columnas del footer anterior pero con
  jerarquía real: el eslogan pasa a ser un cierre callado en lugar del titular
  de 32px que gritaba, y cada columna lleva su rótulo con filete.

  QUÉ SE ELIMINÓ Y POR QUÉ. El footer anterior tenía OCHO enlaces para sólo
  CUATRO destinos:
    - productos.html aparecía 4 veces: "Nuestros Productos", "Pedido de pollo",
      "Pedido de huevos" y "NUESTROS PRODUCTOS". Los dos "pedidos" no llevaban
      a pedir nada distinto: iban al mismo listado. La sección que los agrupaba
      se llamaba "SERVICIOS", que prometía algo que no existe.
    - Sobre-Nosotros.html aparecía 2 veces.
    - El menú inferior ("CERRAR SESIÓN", "NUESTROS PRODUCTOS", "SOBRE
      NOSOTROS") repetía entero enlaces que el header ya tiene en todas las
      páginas, así que se quitó completo. Cerrar sesión sigue disponible en el
      header, que es donde corresponde: es una acción de sesión, no navegación
      de pie de página.
  Ahora hay cinco enlaces y cinco destinos distintos.
-->
<footer class="footer-principal">

    <div class="footer-contenido">

        <!-- Marca: logo y eslogan real de La Morán. -->
        <div class="footer-marca">
            <img src="../../Recursos/Imagenes/logo_la_moran_limpio_transparente.png" alt="Logo La Morán">
            <p class="footer-lema">«Lo mejor, con amor, siempre Morán.»</p>
        </div>

        <!-- Navegación: fusiona las antiguas "INFORMACIÓN" y "SERVICIOS", que
             apuntaban a las mismas dos páginas.

             El aria-label no es opcional: el header inyecta otro <nav> en la
             misma página, así que sin nombre quedan dos regiones "navegación"
             que el lector de pantalla no puede distinguir al saltar entre
             landmarks. -->
        <nav class="footer-seccion" aria-label="Enlaces del pie de página">
            <h3>Navegación</h3>
            <a href="../Cliente/productos.html">Nuestros productos</a>
            <a href="../Cliente/Sobre-Nosotros.html">Sobre nosotros</a>
            <a href="../Cliente/Contacto.html">Contacto</a>
        </nav>

        <div class="footer-seccion">
            <h3>Ubicación</h3>
            <p>San Carlos, Alajuela</p>

            <h3 class="footer-rotulo-siguiente">Síganos</h3>
            <!--
                Instagram es la ÚNICA red social real del negocio; antes se
                anunciaban también LinkedIn, Facebook y YouTube con enlaces
                muertos ("#") y se quitaron por eso. El ícono va como SVG en
                línea (mismo criterio que login.html: sin librería de íconos
                externa). Al ser un enlace externo se abre en otra pestaña,
                con rel="noopener" por seguridad.

                El aria-label EMPIEZA con el texto visible, "@lamoran837", y no
                lo reemplaza. Si dijera solo "Instagram de La Morán", quien usa
                control por voz y dice "clic en lamoran837" —que es lo único que
                ve en pantalla— no podría activar el enlace, porque ese nombre no
                estaría en su nombre accesible.
            -->
            <a class="footer-red" href="https://www.instagram.com/lamoran837/"
               target="_blank" rel="noopener noreferrer"
               aria-label="@lamoran837 — Instagram de La Morán (se abre en otra pestaña)">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="4.5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="16.6" cy="7.4" r="0.9" fill="currentColor" stroke="none"/>
                </svg>
                @lamoran837
            </a>
        </div>

        <!-- Contacto: los dos datos son enlaces reales (mailto: y tel:), no
             texto suelto como antes. En el celular, tocar el teléfono llama. -->
        <div class="footer-seccion">
            <h3>Contacto</h3>
            <a href="mailto:lamoran837@gmail.com">lamoran837@gmail.com</a>
            <a href="tel:+50660916609">+506 6091 6609</a>
        </div>

    </div>

    <!-- Cierre: una línea con la identidad del negocio y la suscripción. -->
    <div class="footer-cierre">
        <p class="footer-firma">Avícola La Morán · Huevo fresco y pollo · San Carlos, Costa Rica</p>

        <!-- Etiqueta VISIBLE, no un aria-label. El footer anterior resolvía esto
             con aria-label sobre el placeholder: servía al lector de pantalla,
             pero no a quien mira, porque el placeholder desaparece apenas se
             empieza a escribir y deja el campo sin ninguna pista de qué iba ahí.
             Sigue sin "action": el envío llega con la capa de base de datos. -->
        <form class="footer-suscripcion">
            <label class="footer-suscripcion-rotulo" for="correo-suscripcion">Únase a nosotros</label>
            <input
                type="email"
                id="correo-suscripcion"
                name="correo_suscripcion"
                placeholder="Ingrese su correo"
            >
        </form>
    </div>

</footer>
