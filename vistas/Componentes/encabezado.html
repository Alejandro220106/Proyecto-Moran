<!--
  Plantilla compartida del header, para todas las páginas de la vista normal
  de usuario cliente (no se usa en login.html, que es una pantalla standalone
  sin nav). Se carga vía fetch() desde "../../Recursos/plantillas.js" -esto es
  HTML plano, editable directamente, sin lógica embebida-.

  Nota: este mismo fragmento antes vivía en "Header.php". Se movió aquí
  porque el proyecto ya no usa PHP para las vistas (PHP queda reservado
  solo para la futura capa de conexión a base de datos).
-->
<header class="header">

    <!-- linea superior / heno -->
    <div class="linea-superior"></div>

    <!-- Contenido del header -->
    <div class="header-contenido">

        <!-- Logo de la Moran -->
        <div class="logo-contenedor">
            <img src="../../Recursos/Imagenes/logo_la_moran_limpio_transparente.png" alt="Logo La Morán" class="logo">
        </div>

        <!-- Menú de navegación -->
        <!-- Enlaces con ../Cliente/ porque este encabezado se inyecta tanto
             en Paginas/Cliente/ como en Paginas/Admin/ (todas las vistas que usan este
             header viven ahí, así que apuntan a páginas hermanas). -->
        <!-- El aria-label no es decorativo: en las ocho pantallas del panel se
         inyecta también la barra lateral, que es otro <nav>. Sin nombre, quien
         navega por landmarks vería dos regiones "navegación" y solo una
         identificada. -->
    <nav class="menu-navegacion" aria-label="Navegación principal">
            <a href="../Cliente/productos.html">NUESTROS<br>PRODUCTOS</a>
            <a href="../Cliente/Sobre-Nosotros.html">SOBRE<br>NOSOTROS</a>
            <a href="../Cliente/Contacto.html">CONTACTO</a>

            <!--
                CARRITO DE COMPRAS: pendiente. El negocio todavía no va a
                procesar datos bancarios, así que el flujo de pago en línea no
                se activa.

                Va como <span> y no como <a>: sin destino real, un enlace sería
                un control con apariencia de interactivo que no lleva a ningún
                lado — el mismo criterio que ya usan los productos
                "Próximamente" del catálogo y las tarjetas pendientes del panel.
                Sin href tampoco recibe foco de teclado, así que quien navega
                sin mouse no tropieza con él.

                pago.html sigue construida y sin borrar: queda sin acceso a
                propósito, esperando que se decida procesar pagos.
            -->
            <span class="enlace-proximamente">CARRITO DE <br>COMPRAS
                <small>Próximamente</small>
            </span>

            <a href="../Cliente/Actualizar-Datos.html">ACTUALIZAR<br>DATOS</a>
            <a href="../Cliente/login.html">CERRAR<br>SESIÓN</a>
        </nav>
    </div>
</header>
