<!--
  Barra lateral del panel de administración. Se inyecta con fetch() desde
  "../../Recursos/plantillas.js" en las OCHO pantallas del panel, igual que el
  header y el footer.

  POR QUÉ EXISTE. Antes, para pasar de un módulo a otro había que volver al
  tablero: entrar, elegir, trabajar, volver, elegir de nuevo. Con la barra
  siempre visible, cambiar de módulo es un clic desde cualquier pantalla. Por
  eso también desaparecieron los enlaces "← Volver al panel" de las siete
  páginas de módulo: ya no hay a dónde volver, el panel está siempre ahí.

  LOS GRUPOS NO SON UN INVENTO. Granja, Ventas y Administración son los mismos
  ámbitos que define el alcance del documento del proyecto. Con nueve módulos
  —y van a ser más— una lista plana obliga a leerla entera cada vez.

  EL ÍTEM ACTIVO LO MARCA EL JAVASCRIPT. Como este fragmento es el mismo para
  las ocho páginas, no puede saber en cuál está; plantillas.js compara el
  nombre del archivo abierto con cada href y le pone la clase .activo al que
  corresponda.

  LOS MÓDULOS PENDIENTES van como <span>, no como <a>: sus páginas no existen
  todavía, y el proyecto ya decidió que no se renderiza un control con
  apariencia de interactivo que no lleve a ningún lado. Sin href tampoco
  reciben foco de teclado.

  CONTADORES: el diseño los contempla (un número por módulo, junto al nombre),
  pero NO se renderizan todavía porque no hay de dónde sacarlos y un número
  inventado en el panel es exactamente lo que este proyecto evita. Cuando
  exista la capa de datos, van como <span class="contador-lateral"> al final
  de cada <a>, y el CSS ya está escrito.
-->
