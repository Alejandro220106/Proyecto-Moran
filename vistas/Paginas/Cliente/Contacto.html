<!DOCTYPE html>
<!--
  Contacto (vista del cliente). Se llega aquí desde "CONTACTO" en el header
  compartido (ya existía ese enlace, solo apuntaba a "#" hasta ahora).

  Página del sitio (no standalone): usa header/footer compartidos
  (#encabezado / #pie-pagina + plantillas.js), igual que registro.html,
  Contraseña-login.html y Actualizar-Datos.html.

  El formulario todavía no tiene "action" ni JavaScript: el envío real del
  mensaje llega con la capa de base de datos. Los campos ya tienen id/name
  listos para engancharla.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | La Morán</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../Recursos/estilos.css">
    <link rel="stylesheet" href="../../Recursos/Cliente/Contacto.css">
</head>
<body>

    <!-- Header compartido. -->
    <div id="encabezado"></div>

    <!-- Contenido sobre fondo oscuro. -->
    <main class="pagina-contacto">
        <section class="contenedor-contacto">
            <h1 class="titulo-contacto">Contáctenos</h1>

            <form id="formulario-contacto">
                <div class="contenedor-campos">

                    <div class="grupo-campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"
                               class="form-control campo-contacto"
                               placeholder="Ingrese sus datos" autocomplete="given-name">
                    </div>

                    <div class="grupo-campo">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido"
                               class="form-control campo-contacto"
                               placeholder="Ingrese sus datos" autocomplete="family-name">
                    </div>

                    <div class="grupo-campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo"
                               class="form-control campo-contacto"
                               placeholder="Ingrese sus datos" autocomplete="email">
                    </div>

                    <div class="grupo-campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono"
                               class="form-control campo-contacto"
                               placeholder="Ingrese sus datos" autocomplete="tel">
                    </div>

                    <div class="grupo-campo">
                        <label for="empresa">Empresa</label>
                        <input type="text" id="empresa" name="empresa"
                               class="form-control campo-contacto"
                               placeholder="Ingrese sus datos">
                    </div>

                    <div class="grupo-campo grupo-mensaje">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="8"
                                  class="form-control campo-contacto"
                                  placeholder="Escriba su mensaje"></textarea>
                    </div>

                </div>

                <div class="contenedor-boton">
                    <button type="submit" id="boton-enviar" class="btn boton-enviar">
                        Enviar
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Footer compartido. -->
    <div id="pie-pagina"></div>

    <script src="../../Recursos/plantillas.js" defer></script>
</body>
</html>
