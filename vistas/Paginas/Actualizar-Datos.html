<!DOCTYPE html>
<!--
  Actualizar datos de usuario (vista del cliente). Se llega aquí desde
  "ACTUALIZAR DATOS" en el header compartido (ver encabezado.html).

  Página del sitio (no standalone): usa header/footer compartidos
  (#encabezado / #pie-pagina + plantillas.js), igual que registro.html y
  Contraseña-login.html.

  El formulario todavía no tiene "action" ni JavaScript: precargar los
  datos actuales del usuario y guardar los cambios llega con la capa de
  base de datos. Los campos ya tienen id/name listos para engancharla.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar datos | La Morán</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../Recursos/estilos.css">
    <link rel="stylesheet" href="../Recursos/Actualizar-Datos.css">
</head>
<body>

    <!-- Header compartido. -->
    <div id="encabezado"></div>

    <!-- Contenido sobre fondo oscuro. -->
    <main class="pagina-actualizar">
        <section class="contenedor-actualizar">
            <h1 class="titulo-actualizar">Actualizar datos</h1>

            <form id="formulario-actualizar-datos">
                <div class="contenedor-campos">

                    <div class="grupo-campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo"
                               class="form-control campo-actualizar"
                               placeholder="Ingrese sus datos" autocomplete="email">
                    </div>

                    <div class="grupo-campo">
                        <label for="usuario">Nombre de usuario</label>
                        <input type="text" id="usuario" name="usuario"
                               class="form-control campo-actualizar"
                               placeholder="Ingrese sus datos" autocomplete="username">
                    </div>

                    <div class="grupo-campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono"
                               class="form-control campo-actualizar"
                               placeholder="Ingrese sus datos" autocomplete="tel">
                    </div>

                    <div class="grupo-campo">
                        <label for="cedula">Identificación / Cédula</label>
                        <input type="text" id="cedula" name="cedula"
                               class="form-control campo-actualizar"
                               placeholder="Ingrese sus datos">
                    </div>

                    <div class="grupo-campo grupo-direccion">
                        <label for="direccion">Dirección</label>
                        <textarea id="direccion" name="direccion" rows="3"
                                  class="form-control campo-actualizar"
                                  placeholder="Ingrese sus datos"></textarea>
                    </div>

                </div>

                <div class="contenedor-boton">
                    <button type="submit" id="boton-actualizar" class="btn boton-actualizar">
                        Aplicar cambios
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Footer compartido. -->
    <div id="pie-pagina"></div>

    <script src="../Recursos/plantillas.js" defer></script>
</body>
</html>
