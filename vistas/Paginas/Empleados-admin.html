<!DOCTYPE html>
<!--
  Gestión de empleados, módulo del panel de administración (vista de
  personal, no de cliente). Se llega desde la tarjeta "Empleados" de
  Home-admin.html.

  Usa header/footer compartidos (#encabezado / #pie-pagina + plantillas.js)
  y el sistema de diseño admin compartido (../Recursos/admin.css).

  La fila de la tabla es de ejemplo (marcador); JavaScript la reemplazará
  con los empleados reales de la base de datos. Los formularios no tienen
  "action" todavía; los ids ya están listos para engancharlos con el JS del
  módulo. Solo frontend por ahora.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de empleados | La Morán</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../Recursos/estilos.css">
    <link rel="stylesheet" href="../Recursos/admin.css">
</head>
<body>

    <!-- Header compartido. -->
    <div id="encabezado"></div>

    <main class="pagina-admin">

        <!-- Vuelve al tablero principal del panel. -->
        <a href="Home-admin.html" class="enlace-volver">← Volver al panel</a>

        <section class="encabezado-modulo">
            <h1>Gestión de Empleados</h1>
            <p>Registro, consulta y actualización del personal de Avícola La Morán.</p>
        </section>

        <!-- Visualización de trabajadores -->
        <section class="panel-admin">
            <div class="titulo-panel">
                <h2>Visualización de trabajadores</h2>
                <button class="btn boton-ambar" id="boton-actualizar-empleados">Actualizar</button>
            </div>

            <div class="tabla-scroll">
                <table class="tabla-admin" id="tabla-empleados">
                    <thead>
                        <tr>
                            <th>Cédula / ID</th>
                            <th>Nombre completo</th>
                            <th>Puesto actual</th>
                            <th>Departamento</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Fila de ejemplo; JavaScript la reemplazará con datos reales. -->
                        <tr>
                            <td>0-0000-0000</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td><span class="estado activo">Activo</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Búsqueda de personal -->
        <section class="panel-admin">
            <div class="titulo-panel">
                <h2>Búsqueda de personal</h2>
            </div>

            <form id="formulario-busqueda-empleados">
                <div class="rejilla-campos">
                    <div class="grupo-campo">
                        <label for="buscar-empleado">Nombre o cédula</label>
                        <input type="search" id="buscar-empleado" name="buscar_empleado"
                               class="form-control campo-admin" placeholder="Ej.: Juan Pérez o 0-0000-0000">
                    </div>
                    <div class="grupo-campo">
                        <label for="filtrar-puesto">Filtrar por puesto</label>
                        <input type="text" id="filtrar-puesto" name="filtrar_puesto"
                               class="form-control campo-admin" placeholder="Ej.: Operario">
                    </div>
                </div>
                <div class="fila-botones">
                    <button type="submit" class="btn boton-ambar" id="boton-filtrar-empleados">Filtrar</button>
                </div>
            </form>
        </section>

        <!-- Registrar / modificar empleados -->
        <section class="panel-admin">
            <div class="titulo-panel">
                <h2>Registrar / modificar empleados</h2>
            </div>

            <form id="formulario-empleado">
                <div class="rejilla-campos">
                    <div class="grupo-campo">
                        <label for="cedula">Cédula / ID</label>
                        <input type="text" id="cedula" name="cedula" class="form-control campo-admin">
                    </div>
                    <div class="grupo-campo">
                        <label for="nombre-completo">Nombre completo</label>
                        <input type="text" id="nombre-completo" name="nombre_completo" class="form-control campo-admin">
                    </div>
                    <div class="grupo-campo">
                        <label for="puesto">Puesto actual</label>
                        <input type="text" id="puesto" name="puesto" class="form-control campo-admin">
                    </div>
                    <div class="grupo-campo">
                        <label for="departamento">Departamento</label>
                        <input type="text" id="departamento" name="departamento" class="form-control campo-admin">
                    </div>
                    <div class="grupo-campo">
                        <label for="fecha-ingreso">Fecha de ingreso</label>
                        <input type="date" id="fecha-ingreso" name="fecha_ingreso" class="form-control campo-admin">
                    </div>
                    <div class="grupo-campo">
                        <label for="estado-empleado">Estado</label>
                        <select id="estado-empleado" name="estado_empleado" class="form-select campo-admin">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="fila-botones">
                    <button type="submit" class="btn boton-ambar" id="boton-registrar-empleado">Registrar empleado</button>
                    <button type="button" class="btn boton-ambar" id="boton-modificar-empleado">Modificar empleado</button>
                </div>
            </form>
        </section>

    </main>

    <!-- Footer compartido. -->
    <div id="pie-pagina"></div>

    <script src="../Recursos/plantillas.js" defer></script>
</body>
</html>
