<!DOCTYPE html>
<!--
  Pantalla de registro de cuenta (vista del cliente). Se llega aquí desde el
  enlace "Registrarse" del login.

  A diferencia de login.html, esta SÍ usa el header/footer compartidos
  (#encabezado / #pie-pagina + plantillas.js), según lo pedido: la tarjeta de
  registro va sobre fondo oscuro entre ambos, no como pantalla standalone.

  Reordenamiento respecto al diseño de referencia: el mock agrupaba
  correo+contraseñas a la izquierda y usuario+teléfono a la derecha, sin una
  razón clara. Aquí se agrupa por tipo de dato (identidad: usuario, correo,
  teléfono | seguridad: contraseña, confirmar contraseña) para que el orden
  de llenado sea más predecible, y el botón REGISTRARSE queda de ancho
  completo en el panel derecho para un blanco de clic más grande.

  El formulario todavía no tiene "action" ni JavaScript: la lógica (validar
  que las contraseñas coincidan, enviar el registro) llega después. Los
  campos ya tienen id/name pensados para engancharla sin tocar el markup.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | La Morán</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../Recursos/estilos.css">
    <link rel="stylesheet" href="../Recursos/registro.css">
</head>
<body>

    <!-- Header compartido. -->
    <div id="encabezado"></div>

    <!-- Contenido sobre fondo oscuro. -->
    <main class="pagina-registro">
        <form class="tarjeta-registro" id="formulario-registro">

            <!-- Panel izquierdo: campos del registro, agrupados por tipo de dato. -->
            <div class="panel-formulario-registro">
                <h1 class="titulo-registro">Crear cuenta</h1>

                <div class="row g-4">
                    <!-- Columna 1: identidad. -->
                    <div class="col-12 col-md-6">
                        <div class="grupo-campo-registro">
                            <label for="nombre-usuario">Nombre de usuario</label>
                            <input type="text" id="nombre-usuario" name="nombre_usuario"
                                   class="form-control campo-registro" placeholder="Ingrese sus datos"
                                   autocomplete="username" required>
                        </div>
                        <div class="grupo-campo-registro">
                            <label for="correo">Correo electrónico</label>
                            <input type="email" id="correo" name="correo"
                                   class="form-control campo-registro" placeholder="Ingrese sus datos"
                                   autocomplete="email" required>
                        </div>
                        <div class="grupo-campo-registro">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono"
                                   class="form-control campo-registro" placeholder="Ingrese sus datos"
                                   autocomplete="tel" required>
                        </div>
                    </div>

                    <!-- Columna 2: seguridad. -->
                    <div class="col-12 col-md-6">
                        <div class="grupo-campo-registro">
                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena"
                                   class="form-control campo-registro" placeholder="Ingrese sus datos"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="grupo-campo-registro">
                            <label for="confirmar-contrasena">Confirmar contraseña</label>
                            <input type="password" id="confirmar-contrasena" name="confirmar_contrasena"
                                   class="form-control campo-registro" placeholder="Ingrese sus datos"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                        <p class="ayuda-campo">Mínimo 8 caracteres. Deberá coincidir con la contraseña.</p>
                    </div>
                </div>
            </div>

            <!-- Panel derecho: aviso de seguridad + acción principal. -->
            <aside class="panel-importante">
                <div class="texto-aviso">
                    <h2 class="titulo-importante">Importante</h2>
                    <p class="subtitulo-importante">No compartir<br>la contraseña</p>
                    <p class="texto-cuerpo-importante">
                        Mantenga su cuenta segura. Nunca revele su contraseña a terceros.
                    </p>
                    <p class="texto-cuerpo-importante">
                        Para su protección, su contraseña debe ser confidencial.
                    </p>
                </div>

                <div class="acciones-registro">
                    <button type="submit" class="btn boton-registrarse w-100">REGISTRARSE</button>
                    <a href="login.html" class="enlace-ya-cuenta">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </aside>

        </form>
    </main>

    <!-- Footer compartido. -->
    <div id="pie-pagina"></div>

    <script src="../Recursos/plantillas.js" defer></script>
</body>
</html>
