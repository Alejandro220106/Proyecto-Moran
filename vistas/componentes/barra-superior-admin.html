  NO ES EL HEADER DEL SITIO PÚBLICO. No lleva logo ni navegación del catálogo,
  solo esto. El panel sigue sin cargar encabezado.html: esta franja es angosta

  header (ver el comentario "SIN HEADER" en cada página admin).
-->
